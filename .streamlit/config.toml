[browser]
gatherUsageStats = false

[server]
# Keep the dev server on localhost only. Do not copy these values into a
# deployment: a public Streamlit server must bind 0.0.0.0, and the headless
# flag is what stops it from trying to open a browser on a machine with no GUI.
address = "127.0.0.1"
headless = true

[theme]
base = "light"
primaryColor = "#0B2545"
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#EDF2F7"
textColor = "#1E293B"
font = "sans serif"
